<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scriptdesk</title>
  <meta name="description" content="A free, offline-friendly scriptwriting tool for screenplays, TV, stage plays, audio plays and comics. Your files stay on your computer.">
  <meta name="theme-color" content="#a8432c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a8432c'/%3E%3Ctext x='16' y='23' font-family='Courier New,monospace' font-weight='700' font-size='20' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="css/app.css?v=9">
  <link rel="stylesheet" href="css/script.css?v=9">
  <style id="page-size-style">@page { size: letter; }</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn only-narrow" data-action="toggle-sidebar" aria-label="Show project panel">☰</button>
      <div class="brand"><span class="brand-mark">S</span><span class="brand-name">Scriptdesk</span></div>
      <input id="project-title" class="project-title" spellcheck="false" aria-label="Project title" title="Project title">
      <div id="save-state" class="save-state"></div>
      <nav class="menu" aria-label="File">
        <div class="dropdown">
          <button class="btn ghost" data-dropdown aria-haspopup="true" title="New project or an example">New ▾</button>
          <div class="dropdown-menu" role="menu">
            <button class="menu-item" data-action="new">Blank project</button>
            <div class="menu-sep"></div>
            <div class="menu-label">Examples to explore</div>
            <button class="menu-item" data-action="example" data-file="examples/the-last-ferry.scriptdesk" data-name="The Last Ferry (example).scriptdesk">🎬 Short film — everything filled in</button>
            <button class="menu-item" data-action="example" data-file="examples/night-shift-pilot.scriptdesk" data-name="Night Shift (example).scriptdesk">📡 TV drama pilot</button>
            <button class="menu-item" data-action="example" data-file="examples/the-flatmates.scriptdesk" data-name="The Flatmates (example).scriptdesk">🛋️ Sitcom (multi-camera)</button>
            <button class="menu-item" data-action="example" data-file="examples/the-lantern.scriptdesk" data-name="The Lantern (example).scriptdesk">🎙️ Audio play</button>
            <button class="menu-item" data-action="example" data-file="examples/the-cartographer.fountain" data-name="The Cartographer.fountain">📄 A Fountain file (plain-text screenplay)</button>
          </div>
        </div>
        <button class="btn ghost" data-action="open" title="Open a project, or import .celtx / .fountain / .fdx (Ctrl+O)">Open…</button>
        <button class="btn primary" data-action="save" title="Save project file (Ctrl+S)">Save</button>
        <div class="dropdown">
          <button class="btn ghost" data-dropdown aria-haspopup="true">Export ▾</button>
          <div class="dropdown-menu align-right" role="menu">
            <button class="menu-item" data-action="print">Print / Save as PDF…<span class="kbd-hint">Ctrl+P</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="export-fountain">Fountain (.fountain)</button>
            <button class="menu-item" data-action="export-fdx">Final Draft (.fdx)</button>
            <button class="menu-item" data-action="export-txt">Plain text (.txt)</button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="review-copy">Review copy for a reader (.html)…</button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="saveas">Save project as…<span class="kbd-hint">Ctrl+Shift+S</span></button>
          </div>
        </div>
        <button class="icon-btn" data-action="search" title="Search the whole project (Ctrl+Shift+F)" aria-label="Search">🔍</button>
        <button class="btn ghost" id="install-btn" data-action="install" hidden title="Install Scriptdesk as an app that works offline">Install app</button>
        <button class="goal-chip" id="goal-chip" data-action="goals" title="Writing goals and sprint timer">⏱</button>
        <button class="icon-btn" data-action="settings" title="Settings" aria-label="Settings">⚙</button>
        <button class="icon-btn" data-action="help" title="Help & shortcuts" aria-label="Help">?</button>
      </nav>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <div class="side-section">
          <div class="side-head">
            <span>Project</span>
            <div class="dropdown">
              <button class="icon-btn" data-dropdown title="Add a document" aria-label="Add a document">+</button>
              <div class="dropdown-menu align-right" role="menu">
                <button class="menu-item" data-action="add-screenplay">🎬 Screenplay</button>
                <button class="menu-item" data-action="add-stageplay">🎭 Stage Play</button>
                <button class="menu-item" data-action="add-audioplay">🎙️ Audio Play</button>
                <button class="menu-item" data-action="add-comic">💬 Comic Book</button>
                <button class="menu-item" data-action="add-teleplay">📡 TV Drama (single camera)</button>
                <button class="menu-item" data-action="add-sitcom">🛋️ Sitcom (multi-camera)</button>
                <button class="menu-item" data-action="add-av">📺 AV Script (video / audio)</button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-action="add-storyline">〰️ Storyline (character flow)</button>
                <button class="menu-item" data-action="add-storyboard">🎞️ Storyboard</button>
                <button class="menu-item" data-action="add-beatboard">🧭 Beat Board</button>
                <button class="menu-item" data-action="add-sketch">📐 Sketch (camera &amp; set plan)</button>
                <button class="menu-item" data-action="add-timeline">⏳ Timeline (story order vs. plot order)</button>
                <button class="menu-item" data-action="add-relations">🕸️ Relationship Map</button>
                <button class="menu-item" data-action="add-moodboard">🎨 Mood Board</button>
                <button class="menu-item" data-action="add-schedule">📅 Production Schedule</button>
                <button class="menu-item" data-action="add-locmap">🗺️ Location Map</button>
                <button class="menu-item" data-action="add-note">📝 Notes</button>
                <button class="menu-item" data-action="add-budget">💶 Budget</button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-action="add-folder">📁 Folder</button>
              </div>
            </div>
          </div>
          <ul class="doc-list" id="doc-list"></ul>
        </div>
        <div class="side-section grow">
          <div class="side-head"><span id="scene-head-label">Scenes</span><span class="count" id="scene-count"></span></div>
          <ol class="scene-list" id="scene-list"></ol>
        </div>
      </aside>

      <section class="workspace">
        <div class="viewbar">
          <div class="tabs" id="view-tabs"></div>
          <div class="toolbar" id="toolbar"></div>
        </div>
        <div class="view-scroll" id="editor-wrap">
          <div class="page editor-page">
            <div id="editor" class="script-text editor"></div>
          </div>
        </div>
        <div class="view-scroll" id="other-view" hidden></div>
      </section>

      <aside class="inspector" id="inspector" aria-label="Scene panel"></aside>
    </div>

    <footer class="statusbar">
      <span id="status-left"></span>
      <span class="status-right">Files stay on your computer</span>
    </footer>
  </div>

  <div id="print-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div class="drop-overlay">Drop a .scriptdesk, .celtx, .fountain or .fdx file to open it</div>
  <input type="file" id="file-input" accept=".scriptdesk,.scriptdesk-review,.json,.celtx,.fountain,.spmd,.txt,.fdx" hidden>

  <script src="js/formats.js?v=9"></script>
  <script src="js/catalog.js?v=9"></script>
  <script src="js/storyline.js?v=9"></script>
  <script src="js/storyboard.js?v=9"></script>
  <script src="js/beatboard.js?v=9"></script>
  <script src="js/sketch.js?v=9"></script>
  <script src="js/schedule.js?v=9"></script>
  <script src="js/budget.js?v=9"></script>
  <script src="js/timeline.js?v=9"></script>
  <script src="js/relations.js?v=9"></script>
  <script src="js/moodboard.js?v=9"></script>
  <script src="js/locmap.js?v=9"></script>
  <script src="js/review.js?v=9"></script>
  <script src="js/touch.js?v=9"></script>
  <script src="js/formats-io.js?v=9"></script>
  <script src="js/editor.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
