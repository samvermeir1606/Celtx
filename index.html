<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scriptdesk</title>
  <meta name="description" content="A free, offline-friendly scriptwriting tool for screenplays, stage plays, audio plays and comics. Your files stay on your computer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a8432c'/%3E%3Ctext x='16' y='23' font-family='Courier New,monospace' font-weight='700' font-size='20' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/script.css">
  <style id="page-size-style">@page { size: letter; }</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn only-narrow" data-action="toggle-sidebar" aria-label="Show project panel">☰</button>
      <div class="brand"><span class="brand-mark">S</span><span class="brand-name">Scriptdesk</span></div>
      <input id="project-title" class="project-title" spellcheck="false" aria-label="Project title" title="Project title">
      <div id="save-state" class="save-state"></div>
      <nav class="menu" aria-label="File">
        <button class="btn ghost" data-action="new" title="New project">New</button>
        <button class="btn ghost" data-action="open" title="Open a project, or import .celtx / .fountain / .fdx (Ctrl+O)">Open…</button>
        <button class="btn primary" data-action="save" title="Save project file (Ctrl+S)">Save</button>
        <div class="dropdown">
          <button class="btn ghost" data-dropdown aria-haspopup="true">Export ▾</button>
          <div class="dropdown-menu align-right" role="menu">
            <button class="menu-item" data-action="print">Print / Save as PDF…<span class="kbd-hint">Ctrl+P</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="export-fountain">Fountain (.fountain)</button>
            <button class="menu-item" data-action="export-fdx">Final Draft (.fdx)</button>
            <button class="menu-item" data-action="export-txt">Plain text (.txt)</button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="saveas">Save project as…<span class="kbd-hint">Ctrl+Shift+S</span></button>
          </div>
        </div>
        <button class="icon-btn" data-action="settings" title="Settings" aria-label="Settings">⚙</button>
        <button class="icon-btn" data-action="help" title="Help & shortcuts" aria-label="Help">?</button>
      </nav>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <div class="side-section">
          <div class="side-head">
            <span>Project</span>
            <div class="dropdown">
              <button class="icon-btn" data-dropdown title="Add a document" aria-label="Add a document">+</button>
              <div class="dropdown-menu align-right" role="menu">
                <button class="menu-item" data-action="add-screenplay">🎬 Screenplay</button>
                <button class="menu-item" data-action="add-stageplay">🎭 Stage Play</button>
                <button class="menu-item" data-action="add-audioplay">🎙️ Audio Play</button>
                <button class="menu-item" data-action="add-comic">💬 Comic Book</button>
                <div class="menu-sep"></div>
                <button class="menu-item" data-action="add-note">📝 Notes</button>
              </div>
            </div>
          </div>
          <ul class="doc-list" id="doc-list"></ul>
        </div>
        <div class="side-section grow">
          <div class="side-head"><span id="scene-head-label">Scenes</span><span class="count" id="scene-count"></span></div>
          <ol class="scene-list" id="scene-list"></ol>
        </div>
      </aside>

      <section class="workspace">
        <div class="viewbar">
          <div class="tabs" id="view-tabs"></div>
          <div class="toolbar" id="toolbar"></div>
        </div>
        <div class="view-scroll" id="editor-wrap">
          <div class="page editor-page">
            <div id="editor" class="script-text editor"></div>
          </div>
        </div>
        <div class="view-scroll" id="other-view" hidden></div>
      </section>

      <aside class="inspector" id="inspector" aria-label="Scene panel"></aside>
    </div>

    <footer class="statusbar">
      <span id="status-left"></span>
      <span class="status-right">Files stay on your computer</span>
    </footer>
  </div>

  <div id="print-root"></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <div class="drop-overlay">Drop a .scriptdesk, .celtx, .fountain or .fdx file to open it</div>
  <input type="file" id="file-input" accept=".scriptdesk,.json,.celtx,.fountain,.spmd,.txt,.fdx" hidden>

  <script src="js/formats.js"></script>
  <script src="js/formats-io.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
